[project]
name = "download-literature"
version = "0.1.0"
description = "Download the PDFs of an APA reference list (open access, OpenAthens, EBSCO, Airiti) and keep an APA 7 list."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.151.0",
    "httpx>=0.28.1",
    "playwright>=1.64.0",
    "pydantic>=2.14.1",
    "pypdf>=6.21.1",
    "sqlalchemy>=2.1.5",
    "starlette>=1.9.0",
    "uvicorn>=0.54.0",
]  # add with `uv add <package>` (never `pip install`)

[project.scripts]
fetch-literature = "download_literature.entrypoints.fetch_cli:main"
literature-web = "download_literature.entrypoints.web_cli:main"

[dependency-groups]
dev = ["ruff>=0.6.0", "mypy>=1.11"]  # add with `uv add --dev <package>`

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
download_literature = ["entrypoints/http/static/*", "adapters/db/migrations/*", "adapters/db/migrations/versions/*"]

[tool.uv]
# Use uv's own downloaded Python (see .python-version), never the system / Homebrew one
python-preference = "only-managed"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]
# Framework-managed files (updated by `agentctl update`) and non-Python folders are not linted here
extend-exclude = ["scripts", ".agents", "gas", "web", "legacy", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
mypy_path = "src"
strict = true
